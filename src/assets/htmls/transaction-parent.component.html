<div class="component-wrapper">
    <ng-container *ngIf="stepCount == 0">
        <div class="component-content "> <app-cnic-input (componentResult)="updateStepper($event)"></app-cnic-input>
        </div>
    </ng-container>

    <app-payment-bill *ngIf="isBillPayment && stepCount == 1" (innerSteps)="updateInnerSteps($event)"
        (componentResult)="updateStepper($event)"></app-payment-bill>
        <app-vas-mobile-topup *ngIf="vas_mobileTopup && stepCount == 1" (innerSteps)="updateInnerSteps($event)"
        (componentResult)="updateStepper($event)"></app-vas-mobile-topup>
    <ng-container *ngIf="!isBillPayment && !vas_mobileTopup">
        <app-tagged-accounts [ngClass]="{ 'hidden': stepCount != 1 || !accountSelection }"
            (componentResult)="setAccount()"></app-tagged-accounts>
    </ng-container>

    <ng-container *ngIf="stepCount == 1">
        <app-transaction-input *ngIf="!accountSelection"
            (componentResult)="updateStepper($event)"></app-transaction-input>


    </ng-container>
    <ng-container *ngIf="stepCount == 2">
        <app-transaction-review (componentResult)="updateStepper(1)"></app-transaction-review>
    </ng-container>

    <ng-container *ngIf="stepCount == 3">
        <app-transaction-result (innerSteps)="updateInnerSteps($event)"></app-transaction-result>
    </ng-container>
</div>
