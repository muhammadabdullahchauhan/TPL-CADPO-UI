<div style="height: 250px;">
</div>
<div class="flex-center">
    <img *ngIf="isSuccess" src="assets/img/success.png" width="250" />
    <img *ngIf="!isSuccess" src="assets/img/diag_icon_error.png" width="250" />
</div>

<div class="row">

    <div style="width: 100%;">
        <p class="input-field-label">Beneficiary Account Title</p>
        <div class="input-container">
            <input type="text" class="input-field" [(ngModel)]="accountTitle" disabled="disabled" placeholder="Beneficiary Account Title">
        </div>
    </div>
</div>
<div class="row">
    <div class="width-100">

        <p class="input-field-label">Amount (PKR)</p>
        <div class="input-container">
            <input type="text" class="input-field" [(ngModel)]="amount" disabled="disabled" placeholder="Amount (PKR)">
        </div>
    </div>

</div>
