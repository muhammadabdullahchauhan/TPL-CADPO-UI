<div style="height: 80px;">
</div>
<ng-container *ngIf="cd_other_flow">
  <div class="component-container">
    <div class="row" style="    justify-content: space-around !important; padding: 20px; gap: 10px; width: 90%;">

      <div>
        <img src="../../../../assets/svg/icon-cash.svg" style="filter: invert(1); width: 100px;">
      </div>
      <div>
        <p class="input-field-label">Kindly place your cash on the tray and click on the count cash button</p>
      </div>
    </div>
    <div class="row">

      <div style="width: 100%;">
        <p class="input-field-label">Beneficiary Account Title</p>
        <div class="input-container prevent-wrapper">
          <input type="text" class="input-field" [(ngModel)]="accountTitle" disabled="disabled" placeholder="Beneficiary Account Title">
        </div>
      </div>
    </div>
    <div class="row">
      <div [ngClass]="{'width-50' : depositedCash > 0,'width-100' : depositedCash <= 0}">
        <p class="input-field-label" *ngIf="depositedCash > 0">Entered Amount (PKR)</p>
        <p class="input-field-label" *ngIf="depositedCash <= 0">Amount (PKR)</p>
        <div class="input-container prevent-wrapper">
          <input type="text" class="input-field" [(ngModel)]="amount" disabled="disabled" placeholder="Amount (PKR)">
        </div>
      </div>
      <div class="width-50" *ngIf="depositedCash > 0">
        <p class="input-field-label">Remaining Amount (PKR)</p>
        <div class="input-container prevent-wrapper">
          <input type="text" class="input-field" [value]="(+amount) - (+depositedCash) > 0 ? (+amount) - (+depositedCash) : '0'" disabled placeholder="Remaining Amount (PKR)">
        </div>
      </div>
    </div>

  </div>
</ng-container>

<div class="d-none col-md-12 col-xl-6    my-col-3">
  <cash-acceptor *ngIf="cashTransaction"  
    (triggerCompleteTransaction)="completeTransaction()" (triggerPicture)="takePicture()"
   (cashAccepting)="placeCash()" (cashAccepted)="cashAcceptedOnce()"
    (setAmount)="setCashAmount($event)" (triggerCancelTransaction)="cancelTransaction()" #cashAcceptor></cash-acceptor>

  <cheque-acceptor *ngIf="chequeTransaction" (triggerPicture)="takePicture()"
  (chequeAccepted)="chequeAccepted($event)"
    (triggerCompleteTransaction)="completeTransaction()" #chequeAcceptor>
  </cheque-acceptor>
</div>
