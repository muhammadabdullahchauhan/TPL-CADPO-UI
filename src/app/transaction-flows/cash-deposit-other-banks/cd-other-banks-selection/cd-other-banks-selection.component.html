<div class="overflow-hidden">
    <div style="height: 30px;"></div>
  
    <div class="flex-center">
      <div class="header-background-color">
        <h1 *ngIf="!filteredBanks" style="color: white;">Type of Banks</h1>
        <h1 *ngIf="filteredBanks" style="color: white;">List of Banks</h1>
      </div>
    </div>
  
    <div class="billing-icon-container" *ngIf="!filteredBanks">
      <ng-container *ngFor="let type of bankTypes">
        <div class="icon"
             (click)="selectCategory(type)"
             [ngClass]="{'selected-category': selectedCategory === type}">
             <img src="assets/img/banking-icons/{{type}}.png" alt="{{type}} Icon" style="width: 78px; height: 78px;">
          <div class="icon-text">{{type}}</div>
        </div>
      </ng-container>
    </div>
  
    <div class="billing-icon-container" *ngIf="filteredBanks">
      <div class="scrollable-container">
        <ng-container *ngFor="let bank of filteredBanks">
          <div class="icon banks for-banks"
               (click)="selectBank(bank)"
               [ngClass]="{'selected-bank': selectedBank.bankId === bank.bankId}">
            <img src="assets/img/banking-icons/{{bank.bankCode}}.png" alt="{{bank.bankName}} Icon" style="width: 78px; height: 78px;">
            <div class="icon-text">{{bank.bankName}}</div>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
