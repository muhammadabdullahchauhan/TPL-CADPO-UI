<div class="stepper-wrapper">
    <div class="step" [ngClass]="{'active': stepCount == 0, 'completed': stepCount > 0}">
      <div class="circle">
        <span *ngIf="stepCount > 0">&#10003;</span> <!-- Checkmark for completed step -->
      </div>
      <div class="label">Enter CNIC</div>
    </div>
    <div class="step-line enlarged" [ngClass]="{'completed-line': stepCount > 0}"></div> <!-- Enlarged line -->
  
    <div class="step" [ngClass]="{'active': stepCount == 1, 'completed': stepCount > 1}">
      <div class="circle">
        <span *ngIf="stepCount > 1">&#10003;</span> <!-- Checkmark for completed step -->
      </div>
      <div class="label">Banks List</div>
    </div>
    <div class="step-line enlarged" [ngClass]="{'completed-line': stepCount > 1}"></div> <!-- Enlarged line -->
  
    <div class="step" [ngClass]="{'active': stepCount == 2, 'completed': stepCount > 2}">
      <div class="circle">
        <span *ngIf="stepCount > 2">&#10003;</span> <!-- Checkmark for completed step -->
      </div>
      <div class="label">Customer Details</div>
    </div>
    <div class="step-line enlarged" [ngClass]="{'completed-line': stepCount > 2}"></div> <!-- Enlarged line -->
  
    <div class="step" [ngClass]="{'active': stepCount == 3, 'completed': stepCount > 3}">
      <div class="circle">
        <span *ngIf="stepCount > 3">&#10003;</span> <!-- Checkmark for completed step -->
      </div>
      <div class="label">Cash Deposit</div>
    </div>
    <div class="step-line enlarged" [ngClass]="{'completed-line': stepCount > 3}"></div> <!-- Enlarged line -->
  
    <div class="step" [ngClass]="{'completed': stepCount == 4}">
      <div class="circle">
        <span *ngIf="stepCount == 4">&#10003;</span> <!-- Checkmark for completed step -->
      </div>
      <div class="label">Summary</div>
    </div>
    <!-- No line after the last step -->
  </div>


  <div class="component-wrapper">

    <app-cnic-input *ngIf="stepCount == 0" 
    (componentResult)="updateStepper($event)"></app-cnic-input>

    <app-cd-other-banks-selection *ngIf="stepCount == 1"
    (componentResult)="updateStepper($event)"></app-cd-other-banks-selection>

    <app-cd-other-banks-input-details (componentResult)="updateStepper($event)" 
    *ngIf="stepCount == 2"></app-cd-other-banks-input-details>
    <app-cd-other-banks-review *ngIf="stepCount == 3" 
    (componentResult)="updateStepper($event)"></app-cd-other-banks-review>

    <app-cd-other-banks-result *ngIf="stepCount == 4"></app-cd-other-banks-result>

</div>
  
<div class="footer-wrapper" *ngIf="!isHardwareBusy && stepCount !== 4 && !(onceDeposited && stepCount === 3)">
  <div class="footer-container" [ngStyle]="{
      'bottom': stepCount === 0 ? '800px' :
                stepCount === 1 ? '190px' :
                stepCount === 2 ? '715px' : 
                stepCount === 3 ? '550px' : '550px'
    }">
    <button [ngClass]="{
      'prev': stepCount === 0 || (stepCount === 1 && !isSubStepBankList),
      'back': isSubStepBankList || stepCount === 2 || stepCount === 3
    }"  
    [disabled]="buttonStateDisabled"
      (click)="(onceDeposited && stepCount >= 3) || (stepCount === 1 && !isSubStepBankList) || stepCount === 0 ? btnCancelTransaction() : btnPrev()">
      <span *ngIf="!(onceDeposited && stepCount >= 3) && !(stepCount === 1 && !isSubStepBankList) && stepCount !== 0 && stepCount <= 4"></span>
      <span *ngIf="(onceDeposited && stepCount >= 3) || (stepCount === 1 && !isSubStepBankList) || stepCount === 0"></span>
    </button>
    <button class="next" [disabled]="buttonStateDisabled" (click)="btnNext()">
      {{ onceDeposited ? 'Proceed' : 'Next' }}
    </button>
  </div>
</div>

<ng-container *ngIf="!isHardwareBusy && stepCount === 3 && onceDeposited">
  <!-- "Cancel" button -->
  <button class="cancel-btn" [disabled]="buttonStateDisabled" (click)="btnCancelTransaction()">
    Cancel
  </button>

  <!-- "Complete" button -->
  <button class="complete-btn" [disabled]="buttonStateDisabled" (click)="btnNext()">
    Complete
  </button>
</ng-container>
