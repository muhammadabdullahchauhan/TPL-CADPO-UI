	document.querySelectorAll('input').forEach(el => {
		el.addEventListener('click', (e) => {

			e.target.selectionStart = e.target.selectionEnd;

		})
	})

	document.querySelectorAll('input').forEach(el => {
		el.addEventListener('select', (e) => {

			e.target.selectionStart = e.target.selectionEnd;

		})
	})

	function focusStepper() {

		var activeElementPosition = $('.here').position().left;
		var desiredLeftPosition = activeElementPosition - 550;

		$(".container").animate({ scrollLeft: desiredLeftPosition }, 500);
	}


	function toggleHeaderDrawer() {
		const headerDrawer = document.querySelector('.header-drawer');
		headerDrawer.classList.toggle('active');

		setTimeout(() => {
			headerDrawer.classList.remove('active');
		}, 3000);
	}

	function toggleBiometricDrawer() {
		const overlay = document.querySelector('.biometric-drawer');
		overlay.classList.toggle('active');

		// setTimeout(() => {

	function hideBiometricDrawer() {
		const overlay = document.querySelector('.biometric-drawer');
		const content = document.querySelector('.biometric-content');
		//	content.classList.remove('anim-popup');
		content.classList.add('anim-popup-out');
		//overlay.classList.add('dismiss');
	}


	document.addEventListener('contextmenu', event => event.preventDefault());

	function animateHomeButtons() {
		let delay = 0;
		setTimeout(function () {
			var boxes = document.getElementsByClassName('fade-in-delay');
			const arr = Array.from(boxes);

			arr.forEach((box) => {
				setTimeout(function () {
					box.classList.add('btn-animate');
				}, (delay));
				delay += 200;
			});
		}, 50);
	}


	function addCard(denomination, serial) {

		$stackedCards = $('.stacked-cards');
		$newCard = $('<div class="currency-notes"><img src="./assets/img/' + denomination + '.png" /><span         class="domin-' + denomination + '">' + serial + '</span></div>');
		$stackedCards.append($newCard);

	}
